[project]
name = "fourth"
version = "0.0.0"
description = "The Fourth Official"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.86.0",
  "hypothesis",
  "pycose>=1.1.0",
  "pyright",
  "pytest",
  "pyyaml",
  "ruff",
  "types-jsonschema>=4.26.0.20261006",
  "types-pyyaml",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*/py"]

[tool.ruff]
line-length = 100
extend-exclude = ["libs/*/py/src/*/models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PL"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests", "libs", "infra"]
addopts = "-ra --strict-markers"

[tool.pyright]
include = ["tests", "libs", "infra"]
typeCheckingMode = "basic"
strict = ["libs"]
ignore = ["libs/*/py/src/*/models"]
pythonVersion = "3.13"
