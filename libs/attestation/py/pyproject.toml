[project]
name = "fourth-attestation"
version = "0.0.0"
description = "Microsoft Azure Attestation token verification and confidential computing policy hashing"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "pyjwt[crypto]>=2.15.1",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
